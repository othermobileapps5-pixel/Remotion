name: Muqova sinov (vaqtinchalik)
on:
  push:
    branches: [claude/muqova]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Muqova
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p public/muqova && cp public/venus/poster.jpg public/muqova/muqova-sinov.jpg
          node scripts/muqova.mjs videos/muqova-sinov.json out
          # rasmsiz (gradient) varianti ham
          cp videos/muqova-sinov.json videos/muqova-gradient.json && node scripts/muqova.mjs videos/muqova-gradient.json out
      - name: kadrlar branch'iga
        run: |
          mkdir -p /tmp/k && cp out/*.jpg /tmp/k/
          git fetch -q origin +refs/heads/kadrlar:refs/remotes/origin/kadrlar && git checkout -q -B kadrlar origin/kadrlar || git checkout -q --orphan kadrlar
          mkdir -p muqova && cp /tmp/k/*.jpg muqova/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muqova && git commit -qm "muqova sinov" && git push -q origin kadrlar
      - uses: actions/upload-artifact@v4
        with: { name: muqova, path: "out/*.jpg" }
