# Musiqa kutubxonasi: egasi yuborgan tekin trek (Pixabay, YouTube Audio Library) → public/musiqa/kutubxona/.
# Bot audio faylni olib shu workflow'ni ishga tushiradi (tg_fayl); qo'lda — Drive'dagi fayl nomi (drive).
name: Musiqa kutubxona

on:
  workflow_dispatch:
    inputs:
      toplam:
        description: "Kutubxonani to'ldirish: turli kayfiyatlar bo'yicha har biridan 2 ta trek (bor bo'lsa o'tkazib yuboradi)"
        type: boolean
        default: false
      qidiruv:
        description: "Pixabay'da qidirish (inglizcha, masalan: arabic female vocal duduk) — topilganlarni yuklaydi"
        default: ""
      soni:
        description: "Qidiruvda nechta trek olish"
        default: "3"
      min_soniya:
        description: "Trek kamida necha soniya bo'lsin"
        default: "60"
      tg_fayl:
        description: "Telegram file_id (bot to'ldiradi)"
        default: ""
      drive:
        description: "Yoki Drive'dagi fayl nomi (Claude papkasi, masalan Reference'dagi duduk.mp3)"
        default: ""
      nom:
        description: "Trek nomi"
        default: ""
      teglar:
        description: "Teglar, vergul bilan (misr, duduk, sirli, ayol vokali...)"
        default: ""
      manba:
        description: "Manba (pixabay, youtube, boshqa)"
        default: pixabay
      telegram:
        description: "Javob yuboriladigan Telegram chat"
        default: ""

permissions:
  contents: write

concurrency:
  group: musiqa-kutubxona
  cancel-in-progress: false

jobs:
  qosh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Faylni olish
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FID: ${{ github.event.inputs.tg_fayl }}
          DRIVE: ${{ github.event.inputs.drive }}
          QIDIRUV: ${{ github.event.inputs.qidiruv }}
          TOPLAM: ${{ github.event.inputs.toplam }}
          SONI: ${{ github.event.inputs.soni }}
          MIN: ${{ github.event.inputs.min_soniya }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          mkdir -p /tmp/m
          export RASM_KALIT=$(node -e 'console.log(require("crypto").createHash("sha256").update("rasm:"+process.env.TELEGRAM_BOT_TOKEN).digest("hex"))')
          if [ "$TOPLAM" = true ]; then
            # mavzular: tarix/Sharq, hujjatli, texnika, sport, sirli, sokin, quvnoq, yo'l, urush, ilm-fan...
            echo '[]' > /tmp/m/natija.json; XATO=0
            while IFS= read -r Q; do
              [ -z "$Q" ] && continue
              [ "$XATO" -ge 3 ] && { echo "Pixabay ketma-ket 3 marta to'sdi — to'xtadim (keyinroq qayta ishga tushiring)"; break; }
              grep -qi "\"$Q\"" public/musiqa/kutubxona.json 2>/dev/null && { echo "bor: $Q"; continue; }
              rm -rf /tmp/q && python3 -I scripts/pixabay_musiqa.py "$Q" 2 90 /tmp/q || { echo "! $Q"; XATO=$((XATO+1)); continue; }
              XATO=0
              node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/m/natija.json"));const b=JSON.parse(fs.readFileSync("/tmp/q/natija.json"));for(const t of b){const f="/tmp/m/"+require("path").basename(t.fayl);fs.copyFileSync(t.fayl,f);a.push({...t,fayl:f,teglar:[process.argv[1],...(t.teglar||[])]})}fs.writeFileSync("/tmp/m/natija.json",JSON.stringify(a))' "$Q"
            done <<'Q'
          arabic female vocal
          egypt ambient
          duduk
          persian santur
          silk road
          epic cinematic
          documentary background
          dark suspense
          mystery ambient
          tech corporate
          inspiring piano
          upbeat happy
          country road guitar
          war drums
          space ambient
          sad emotional
          Q
            [ "$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/m/natija.json")).length)')" -gt 0 ] || { echo "::error::Pixabay hech narsa bermadi (403) — keyinroq qayta ishga tushiring"; exit 1; }
          elif [ -n "$QIDIRUV" ]; then
            python3 -I scripts/pixabay_musiqa.py "$QIDIRUV" "$SONI" "$MIN" /tmp/m
          elif [ -n "$FID" ]; then
            P=$(curl -s "https://api.telegram.org/bot$TG/getFile?file_id=$FID" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.ok){console.error(s);process.exit(1)}console.log(j.result.file_path)})')
            EXT="${P##*.}"; curl -s -o "/tmp/m/kirish.$EXT" "https://api.telegram.org/file/bot$TG/$P"
          elif [ -n "$DRIVE" ]; then
            node scripts/drive.mjs get "$DRIVE" "/tmp/m/$DRIVE"
          else
            echo "::error::tg_fayl yoki drive kerak"; exit 1
          fi
          ls -lh /tmp/m
      - name: Kutubxonaga qo'shish
        id: q
        env:
          NOM: ${{ github.event.inputs.nom }}
          TEGLAR: ${{ github.event.inputs.teglar }}
          MANBA: ${{ github.event.inputs.manba }}
          DRIVE: ${{ github.event.inputs.drive }}
          QIDIRUV: ${{ github.event.inputs.qidiruv }}
        run: |
          if [ -f /tmp/m/natija.json ]; then
            Y=$(node -e '
              const {execFileSync}=require("child_process");
              const r=JSON.parse(require("fs").readFileSync("/tmp/m/natija.json","utf8"));
              const out=r.map(t=>JSON.parse(execFileSync("node",["scripts/kutubxona.mjs","qosh",t.fayl,t.nom,[process.env.TEGLAR,process.env.QIDIRUV,...(t.teglar||[])].filter(Boolean).join(","),"pixabay"],{encoding:"utf8"}).trim().split("\n").pop()));
              console.log(JSON.stringify(out));')
          else
            F=$(ls /tmp/m/* | head -1)
            [ -n "$NOM" ] || NOM="${DRIVE:-}"
            Y="[$(node scripts/kutubxona.mjs qosh "$F" "$NOM" "$TEGLAR" "$MANBA" | tail -1)]"
          fi
          echo "$Y"
          echo "yozuv=$Y" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/musiqa && git commit -qm "Musiqa kutubxonasi: $(echo "$Y" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(y=>y.fayl).join(", ")))')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
      - name: Telegram
        if: always() && github.event.inputs.telegram != ''
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ github.event.inputs.telegram }}
          Y: ${{ steps.q.outputs.yozuv }}
        run: |
          if [ -n "$Y" ] && [ "$Y" != "[]" ]; then
            echo "$Y" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const y of JSON.parse(s))console.log([y.fayl,`🎵 ${y.nom}\n⏱ ${Math.floor(y.soniya/60)}:${String(y.soniya%60).padStart(2,"0")} · 🏷 ${y.teglar.slice(0,6).join(", ")}\n📁 ${y.fayl}`].join("\t"))})' | while IFS=$'\t' read -r F CAP; do
              curl -s -F chat_id="$CHAT" -F audio=@"public/$F" -F caption="$(printf '%b' "$CAP")" "https://api.telegram.org/bot$TG/sendAudio" >/dev/null
            done
          else
            curl -s --data-urlencode "chat_id=$CHAT" --data-urlencode "text=⚠️ Musiqani kutubxonaga qo'shib bo'lmadi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://api.telegram.org/bot$TG/sendMessage" >/dev/null
          fi
