# Video yasash: faqat qo'lda — Actions → «Video yasash» → yashil «Run workflow».
# Natija (MP4) «videolar» relizida va Actions artifact'ida.
name: Video yasash

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ssenariy nomi (videos/ papkasidagi fayl, .json siz)"
        default: namuna
        required: true
      format:
        description: "Format"
        type: choice
        options: [youtube, shorts, ikkalasi]
        default: youtube
      ai_kliplar:
        description: "AI kliplarni yasash (pullik! FAL_KEY va/yoki RUNWAY_KEY secret kerak)"
        type: boolean
        default: false
      max_klip:
        description: "Eng ko'pi bilan nechta AI klip (xarajat chegarasi)"
        default: "10"

permissions:
  contents: write

concurrency:
  group: video-${{ github.event.inputs.video }}
  cancel-in-progress: false

jobs:
  # Qaysi yo'l: blender/<video>.py bo'lsa — Blender (3D shisha), aks holda — Remotion ssenariy
  plan:
    runs-on: ubuntu-latest
    outputs:
      blender: ${{ steps.p.outputs.blender }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: |
          if [ -f "blender/$VIDEO.py" ]; then echo "blender=true" >> "$GITHUB_OUTPUT"; else echo "blender=false" >> "$GITHUB_OUTPUT"; fi

  # Blender: 4 ta parallel bo'lak (har biri 150 kadr), keyin bitta MP4
  blender:
    needs: plan
    if: needs.plan.outputs.blender == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    env:
      VIDEO: ${{ github.event.inputs.video }}
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2 LTS
        run: |
          sudo snap install blender --classic --channel=4.2lts/stable
          blender --version | head -1
      - name: Kadrlar
        run: |
          S=$(( (${{ matrix.part }} - 1) * 150 + 1 )); E=$(( ${{ matrix.part }} * 150 ))
          blender -b -P "blender/$VIDEO.py" -- --start $S --end $E --out out/frames 2>&1 | grep -E "✓|Error|error" || true
          ls out/frames | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: kadrlar-${{ matrix.part }}
          path: out/frames/*.png
          retention-days: 1

  blender-mp4:
    needs: blender
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO: ${{ github.event.inputs.video }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kadrlar-*
          path: out/frames
          merge-multiple: true
      - name: MP4 (H.264, 30 fps)
        run: |
          ls out/frames | wc -l
          ffmpeg -y -framerate 30 -i out/frames/f%04d.png -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -movflags +faststart "out/$VIDEO.mp4"
      - name: Relizga yuklash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videolar >/dev/null 2>&1 || gh release create videolar --title "Videolar" --notes "Yasalgan videolar"
          gh release upload videolar "out/$VIDEO.mp4" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.video }}
          path: out/*.mp4
          retention-days: 7

  render:
    needs: plan
    if: needs.plan.outputs.blender != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VIDEO: ${{ github.event.inputs.video }}
      FORMAT: ${{ github.event.inputs.format }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ssenariy borligini tekshirish
        run: test -f "videos/$VIDEO.json" || { echo "::error::videos/$VIDEO.json topilmadi"; exit 1; }

      - name: Paketlar
        run: npm install --no-audit --no-fund

      - name: O'zbekcha ovoz (Azure)
        env:
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
        run: |
          node scripts/ovoz.mjs "videos/$VIDEO.json"
          # Yasalgan ovozlarni repoga saqlaymiz — keyingi renderda qayta yasalmaydi
          if [ -n "$(git status --porcelain public/ovoz videos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/ovoz "videos/$VIDEO.json"
            git commit -m "Ovoz: $VIDEO"
            git push
          fi

      - name: AI kliplar (fal.ai / Runway)
        if: ${{ github.event.inputs.ai_kliplar == 'true' }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RUNWAY_KEY: ${{ secrets.RUNWAY_KEY }}
        run: |
          ASPECT=16:9; [ "$FORMAT" = shorts ] && ASPECT=9:16
          node scripts/fal.mjs "videos/$VIDEO.json" "$ASPECT" "${{ github.event.inputs.max_klip }}"
          # Yasalgan kliplarni repoga saqlaymiz — keyingi renderda qayta pul to'lanmaydi
          if [ -n "$(git status --porcelain public/fal videos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fal "videos/$VIDEO.json"
            git commit -m "AI kliplar: $VIDEO"
            git push
          fi

      - name: Render
        run: |
          mkdir -p out
          if [ "$FORMAT" = youtube ] || [ "$FORMAT" = ikkalasi ]; then
            npx remotion render src/index.ts YouTube "out/$VIDEO-youtube.mp4" --props="videos/$VIDEO.json"
          fi
          if [ "$FORMAT" = shorts ] || [ "$FORMAT" = ikkalasi ]; then
            npx remotion render src/index.ts Shorts "out/$VIDEO-shorts.mp4" --props="videos/$VIDEO.json"
          fi
          ls -lh out

      - name: «videolar» relizga yuklash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videolar >/dev/null 2>&1 || gh release create videolar --title "Videolar" --notes "Tayyor videolar (MP4)" --prerelease
          gh release upload videolar out/*.mp4 --clobber
          echo "### Tayyor" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.mp4; do echo "- https://github.com/${{ github.repository }}/releases/download/videolar/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}-mp4
          path: out/*.mp4
          retention-days: 7
