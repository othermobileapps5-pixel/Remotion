name: Rasm yasash
on:
  push:
    branches: ['claude/rasm-*']
    paths: ['rasm/*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node rasm/yasash.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
      - if: always()
        run: |
          { echo '```'; ls -la rasm/out 2>&1; cat rasm/out/log.txt 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add rasm/out
          git commit -q -m "Rasmlar yasaldi" || exit 0
          git push origin HEAD:"$GITHUB_REF_NAME" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
