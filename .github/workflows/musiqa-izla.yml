name: Musiqa izlash (OpenMontage, Pixabay)
on:
  push:
    branches: [claude/giza]
    paths: ['musiqa/izla.py', '.github/workflows/musiqa-izla.yml']
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: OpenMontage (qotirilgan versiya)
        run: |
          mkdir -p ~/OpenMontage && cd ~/OpenMontage && git init -q && git remote add origin https://github.com/calesthio/OpenMontage
          GIT_LFS_SKIP_SMUDGE=1 git fetch -q --depth 1 origin 2e003e65fa99a0f329478a2c1cdcf26bc481933a && git checkout -q FETCH_HEAD
          pip install -q -r requirements.txt 2>/dev/null || true
      - name: Izlash
        run: python musiqa/izla.py
      - name: Relizga
        run: |
          ls -la musiqa/out
          gh release view musiqa >/dev/null 2>&1 || gh release create musiqa -t "Musiqa nomzodlari" -n "Pixabay (OpenMontage)" --prerelease
          gh release upload musiqa musiqa/out/* --clobber
