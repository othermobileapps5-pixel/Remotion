name: Lyria musiqa (giza)
on:
  push:
    branches: [claude/giza]
    paths: ['musiqa/giza-*.json', '.github/workflows/lyria.yml']
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-latest
    env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in musiqa/giza-a.json musiqa/giza-b.json; do node scripts/musiqa.mjs "$f"; done
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add public/musiqa musiqa && git commit -qm "Lyria: giza musiqa" && git push
