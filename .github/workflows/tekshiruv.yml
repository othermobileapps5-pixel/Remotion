# Tez tekshiruv (avtomatik, arzon): TypeScript va namuna videodan bitta kadr.
# To'liq video yasalmaydi — buning uchun «Video yasash» workflow'i (qo'lda).
name: Tekshiruv

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ssenariy nomi (videos/<nom>.json) — maxsus komponent kadrlari uchun"
        required: false
        default: ''
      kadrlar:
        description: "Kadr raqamlari, vergul bilan"
        required: false
        default: '40,200,420,700,1000'
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'videos/**', 'package.json', 'remotion.config.ts']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Ssenariylar (JSON)
        run: for f in videos/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✓ $f"; done
      - name: Namunadan 2 ta kadr (YouTube va Shorts)
        run: |
          npx remotion still src/index.ts YouTube out/youtube.png --frame=60 --props=videos/namuna.json
          npx remotion still src/index.ts Shorts out/shorts.png --frame=200 --props=videos/namuna.json
      - name: Maxsus komponent kadrlari (qo'lda ishga tushirilganda)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.video != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO: ${{ github.event.inputs.video }}
          KADRLAR: ${{ github.event.inputs.kadrlar }}
        run: |
          COMP=$(node -e "console.log(require('./videos/$VIDEO.json').komponent || 'Shorts')")
          for k in ${KADRLAR//,/ }; do
            npx remotion still src/index.ts "$COMP" "out/$VIDEO-$k.png" --frame=$k --props="videos/$VIDEO.json" --scale=0.5
          done
          # kadrlarni bitta varaqqa yig'ib, «kadrlar» relizga qo'yamiz (chatda ko'rish uchun)
          npx remotion ffmpeg -y -pattern_type glob -i "out/$VIDEO-*.png" -filter_complex "tile=4x2" "out/$VIDEO-varaq.jpg" || true
          gh release view kadrlar >/dev/null 2>&1 || gh release create kadrlar --title "Kadrlar" --notes "Tekshiruv kadrlari" --prerelease
          gh release upload kadrlar out/$VIDEO-*.png out/$VIDEO-varaq.jpg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kadrlar
          path: out/*.png
          retention-days: 3
