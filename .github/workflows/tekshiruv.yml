# Tez tekshiruv (avtomatik, arzon): TypeScript va namuna videodan bitta kadr.
# To'liq video yasalmaydi — buning uchun «Video yasash» workflow'i (qo'lda).
name: Tekshiruv

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ssenariy nomi (videos/<nom>.json) — maxsus komponent kadrlari uchun"
        required: false
        default: ''
      kadrlar:
        description: "Kadr raqamlari, vergul bilan"
        required: false
        default: '40,200,420,700,1000'
  pull_request:
  push:
    paths: ['src/**', 'videos/**', 'scripts/kadrlar.mjs', '.github/workflows/tekshiruv.yml', 'package.json', 'remotion.config.ts']

permissions:
  contents: write # kadrlarni «kadrlar» branch'iga va «kadrlar» relizga yozish uchun

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Ssenariylar (JSON)
        run: for f in videos/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✓ $f"; done
      - name: Namunadan 2 ta kadr (YouTube va Shorts)
        run: |
          npx remotion still src/index.ts YouTube out/youtube.png --frame=60 --props=videos/namuna.json
          npx remotion still src/index.ts Shorts out/shorts.png --frame=200 --props=videos/namuna.json
      - name: O'zgargan ssenariylardan kadrlar (har sahnadan 2 ta)
        run: |
          BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ] && BASE=HEAD~1
          for f in $(git diff --name-only "$BASE" HEAD -- 'videos/*.json'); do
            C=YouTube; grep -q '"shorts/klip"' "$f" 2>/dev/null && C=Shorts
            [ -f "$f" ] && node scripts/kadrlar.mjs "$f" $C || true
          done
          ls out/kadrlar 2>/dev/null | head -50 || true
      - name: Kadrlarni «kadrlar» branch'iga saqlash (telefondan ko'rish uchun)
        if: ${{ github.event_name == 'push' }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls out/kadrlar/*.jpeg >/dev/null 2>&1 || exit 0
          cd out/kadrlar
          git init -q && git checkout -q -b kadrlar && git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Kadrlar: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" kadrlar
      - name: Maxsus komponent kadrlari (qo'lda ishga tushirilganda)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.video != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO: ${{ github.event.inputs.video }}
          KADRLAR: ${{ github.event.inputs.kadrlar }}
        run: |
          COMP=$(node -e "console.log(require('./videos/$VIDEO.json').komponent || 'Shorts')")
          for k in ${KADRLAR//,/ }; do
            npx remotion still src/index.ts "$COMP" "out/$VIDEO-$k.png" --frame=$k --props="videos/$VIDEO.json" --scale=0.5
          done
          # kadrlarni «kadrlar» relizga qo'yamiz (chatda ko'rish uchun)
          gh release view kadrlar >/dev/null 2>&1 || gh release create kadrlar --title "Kadrlar" --notes "Tekshiruv kadrlari" --prerelease
          gh release upload kadrlar out/$VIDEO-*.png --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kadrlar
          path: |
            out/*.png
            out/kadrlar/*.jpeg
          retention-days: 3
