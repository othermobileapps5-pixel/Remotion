# Referens video tahlili: Gemini videoni YouTube havolasidan o'zi ko'radi (tasvir + ovoz), statistika — YouTube API.
# Hech narsa yuklab olinmaydi va hech qayerga joylanmaydi (repo ochiq). yt-dlp GitHub serverlarida YouTube tomonidan bloklanadi.
name: Referens tahlil

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video havolasi"
        required: true
      telegram:
        description: "Natija yuboriladigan Telegram chat (bot to'ldiradi)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tahlil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: ${{ github.event.inputs.url }}
      CHAT: ${{ github.event.inputs.telegram }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Tahlil (YouTube API + Gemini video)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.BOT_GEMINI_KEY }}
          YTC: ${{ secrets.YT_CLIENT_ID }}
          YTS: ${{ secrets.YT_CLIENT_SECRET }}
          YTR: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const e = process.env;
          const id = (e.URL.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/) || [])[1];
          if (!id) { console.log('::error::YouTube video ID topilmadi'); process.exit(1); }
          const url = `https://www.youtube.com/watch?v=${id}`;
          (async () => {
            // 1) statistika (YouTube Data API, 1 birlik)
            let info = {};
            if (e.YTR) {
              const tk = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', body: new URLSearchParams({ client_id: e.YTC.trim(), client_secret: e.YTS.trim(), refresh_token: e.YTR.trim(), grant_type: 'refresh_token' }) }).then((r) => r.json());
              if (tk.access_token) {
                const v = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${id}`, { headers: { Authorization: `Bearer ${tk.access_token}` } }).then((r) => r.json());
                const x = v.items?.[0];
                if (x) info = { nom: x.snippet.title, kanal: x.snippet.channelTitle, sana: x.snippet.publishedAt.slice(0, 10), uzunlik: x.contentDetails.duration, korish: +x.statistics.viewCount || 0, layk: +x.statistics.likeCount || 0, izoh: +x.statistics.commentCount || 0, teglar: (x.snippet.tags || []).slice(0, 12), rasm: x.snippet.thumbnails?.high?.url };
              } else console.log('YouTube token:', JSON.stringify(tk).slice(0, 120));
            }
            console.log(JSON.stringify(info));
            // 2) Gemini videoni o'zi ko'radi
            const system = `Sen YouTube video tahlilchisisan. Egasi o'zbek, AQShda tirakchi; o'z kanalida kinetik matn + ovozli videolar yasaydi (Remotion). Videoni KO'RIB tahlil qil. O'zbek tilida, oddiy matn (HTML/markdown yulduzchalarsiz), 18-25 qator:
          1) Hook — birinchi 3-5 soniyada aynan nima ko'rsatiladi/aytiladi.
          2) Tuzilma — bo'limlar vaqtlari bilan (0:00 …), temp: kadr almashish tezligi, ovoz/musiqa, ekrandagi matn uslubi.
          3) Nega ishlayapti — 3 sabab (raqamlar faqat berilgan statistikadan).
          4) Bizga moslash — shu uslubda O'Z videomiz uchun 3 ta aniq g'oya; ko'chirmasdan, kinetik matn + ovoz bilan qilsa bo'ladigan.`;
            const parts = [{ file_data: { file_uri: url } }, { text: 'Statistika: ' + JSON.stringify(info) }];
            let xulosa = '', oxirgi = '';
            for (const key of [e.GEMINI_API_KEY, e.GEMINI_FREE_KEY].filter((k, i, a) => k && a.indexOf(k) === i)) {
              for (const model of ['gemini-3.8-flash', 'gemini-3.8-flash-lite', 'gemini-3.8-pro']) {
                for (let u = 0; u < 3 && !xulosa; u++) {
                  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                    method: 'POST', headers: { 'x-goog-api-key': key, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts }], generationConfig: { mediaResolution: 'MEDIA_RESOLUTION_LOW' } }),
                    signal: AbortSignal.timeout(150000),
                  }).catch((err) => ({ ok: false, status: 'vaqt', text: async () => String(err.name) }));
                  if (r.ok) { const j = await r.json(); xulosa = (j.candidates?.[0]?.content?.parts || []).map((p) => p.text || '').join('').trim(); break; }
                  oxirgi = `${model} ${r.status} ${(await r.text()).slice(0, 200)}`; console.log(oxirgi);
                  if (r.status === 402 || r.status === 404 || r.status === 'vaqt') break;
                  await new Promise((s) => setTimeout(s, 8000 * (u + 1)));
                }
                if (xulosa) break;
              }
              if (xulosa) break;
            }
            if (!xulosa) { fs.writeFileSync('/tmp/xato.txt', oxirgi); process.exit(1); }
            const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n ?? '?'));
            const bosh = info.nom ? `🔎 Referens: ${info.nom}\n${info.kanal} · ${k(info.korish)} ko'rish · ${k(info.layk)} layk · ${info.sana}` : `🔎 Referens: ${url}`;
            fs.writeFileSync('/tmp/natija.json', JSON.stringify({ matn: (bosh + '\n\n' + xulosa).slice(0, 4000), rasm: info.rasm || '' }));
            console.log(xulosa);
          })().catch((err) => { console.log(err); process.exit(1); });
          JS

      - name: Telegram'ga yuborish
        if: ${{ env.CHAT != '' }}
        run: |
          RASM=$(node -p "require('/tmp/natija.json').rasm")
          [ -n "$RASM" ] && curl -s "https://api.telegram.org/bot$TG/sendPhoto" --data-urlencode chat_id="$CHAT" --data-urlencode photo="$RASM" > /dev/null
          node -e "process.stdout.write(require('/tmp/natija.json').matn)" > /tmp/matn.txt
          curl -s "https://api.telegram.org/bot$TG/sendMessage" --data-urlencode chat_id="$CHAT" --data-urlencode text@/tmp/matn.txt | head -c 150

      - name: Telegram'ga xato
        if: ${{ failure() && env.CHAT != '' }}
        run: |
          curl -s "https://api.telegram.org/bot$TG/sendMessage" --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="⚠️ Referensni tahlil qilib bo'lmadi (video yopiq/yosh cheklovli bo'lishi yoki Gemini band bo'lishi mumkin). Birozdan keyin qayta yuboring yoki Claude chatida «referens xatosini ko'r» deb yozing." > /dev/null || true
